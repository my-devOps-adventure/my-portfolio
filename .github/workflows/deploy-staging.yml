name: Deploy Staging

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        default: latest

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  deploy:
    name: Deploy To K3s Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: http://portfolio.local
    concurrency:
      group: portfolio-staging
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate staging kubeconfig secret
        env:
          K3S_KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG_B64 }}
        run: |
          if [ -z "$K3S_KUBECONFIG_B64" ]; then
            echo "::error::K3S_KUBECONFIG_B64 is required in the staging environment."
            exit 1
          fi

          if ! echo "$K3S_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"; then
            echo "::error::K3S_KUBECONFIG_B64 must be valid base64 kubeconfig content."
            exit 1
          fi

          if [ ! -s "$RUNNER_TEMP/kubeconfig" ]; then
            echo "::error::Decoded kubeconfig is empty."
            exit 1
          fi

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cp "$RUNNER_TEMP/kubeconfig" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy manifests with selected image
        run: |
          kubectl kustomize k8s/staging \
            | sed "s#ghcr.io/example/portfolio:latest#${IMAGE_NAME}:${IMAGE_TAG}#g" \
            | kubectl apply --validate=false -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/portfolio --namespace portfolio-staging --timeout=120s

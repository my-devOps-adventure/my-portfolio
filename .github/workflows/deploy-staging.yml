name: Deploy Staging

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy To K3s Staging
    # GitHub-hosted runners cannot reach a private LAN IP (e.g. 192.168.x.x).
    # Install a self-hosted runner on the K3s machine — see docs/github-self-hosted-runner.md.
    runs-on: k3s-staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: http://portfolio.local
    concurrency:
      group: portfolio-staging
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image name
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${owner_lc}/portfolio" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Preflight required secret
        env:
          K3S_KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG_B64 }}
        run: |
          if [ -z "${K3S_KUBECONFIG_B64:-}" ]; then
            echo "::error::Missing staging environment secret K3S_KUBECONFIG_B64."
            exit 1
          fi

      - name: Configure kubeconfig
        env:
          K3S_KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$K3S_KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Configure GHCR pull secret
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_USERNAME:-}" ] || [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "::error::Missing staging secrets GHCR_PULL_USERNAME and/or GHCR_PULL_TOKEN."
            exit 1
          fi
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --namespace=portfolio-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests with selected image
        run: |
          echo "Deploying ${IMAGE_NAME}:${IMAGE_TAG}"
          kubectl kustomize k8s/staging \
            | sed "s#ghcr.io/example/portfolio:latest#${IMAGE_NAME}:${IMAGE_TAG}#g" \
            | kubectl apply --validate=false -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/portfolio --namespace portfolio-staging --timeout=180s
